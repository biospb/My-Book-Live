# Samba 4.2x configuration for the My Book Live running Debian sid on kernel 4.19.99.
# Based on the Jessie config (smb.conf + smb-global.conf + overall_share), without options
# that no longer exist in Samba 4.2x (write cache size, read/write raw, large readwrite, max xmit).

[global]
	workgroup = WORKGROUP
	netbios name = wd
	server string = My Book Live Network Storage
	server role = standalone server
	dos charset = cp866
	unix charset = UTF8

	interfaces = lo eth0
	bind interfaces only = yes
	disable netbios = yes
	smb ports = 445
	server min protocol = SMB2_10

	security = user
	passdb backend = tdbsam
	map to guest = bad user
	guest account = nobody

	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# samba-dcerpcd (started from /etc/init.d/smbd before smbd) serves
	# \pipe\srvsvc etc. with preforked rpcd_classic/winreg workers;
	# without helpers=no it refuses to start in standalone mode. With
	# on-demand helpers the first RPC after idle forks 8 rpcd processes
	# at once and stalls an active transfer for ~5 s at 100% CPU.
	rpc start on demand helpers = no
	rpc_server:mdssvc = disabled
	rpc_server:witness = disabled
	rpc_server:fsrvp = disabled
	rpc_server:spoolss = disabled
	rpc_server:netlogon = disabled
	rpcd_classic:idle_seconds = 86400
	rpcd_classic:num_workers = 2
	rpcd_winreg:num_workers = 2
	rpcd_lsad:num_workers = 1
	rpcd_epmapper:num_workers = 1
	rpcd_winreg:idle_seconds = 86400
	rpcd_lsad:idle_seconds = 86400
	rpcd_epmapper:idle_seconds = 86400
	rpc_daemon:spoolssd = disabled
	rpc_daemon:mdssd = disabled
	rpc_daemon:lsasd = disabled
	rpc_daemon:fssd = disabled


	log file = /var/log/samba/log.%m
	max log size = 1000
	logging = file

	# Performance on a slow CPU: no signing/encryption, zero-copy send, splice on receive
	server signing = disabled
	server smb encrypt = off
	use sendfile = yes
	aio read size = 0
	min receivefile size = 16384
	socket options = TCP_NODELAY IPTOS_LOWDELAY
	strict allocate = yes
	deadtime = 15

	unix extensions = no
	case sensitive = auto
	preserve case = yes
	short preserve case = yes
	veto files = /.nflc_data/

[Public]
	path = /DataVolume/shares/Public
	comment = Public Share
	guest ok = yes
	browseable = yes
	writable = yes
	create mask = 0744
	directory mask = 0775
	map read only = no
