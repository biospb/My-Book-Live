# Samba 4.2x configuration for the My Book Live running Debian sid on kernel 4.19.99.
# Based on the Jessie config (smb.conf + smb-global.conf + overall_share), without options
# that no longer exist in Samba 4.2x (write cache size, read/write raw, large readwrite, max xmit).

[global]
	workgroup = WORKGROUP
	netbios name = wd
	server string = My Book Live Network Storage
	server role = standalone server
	dos charset = cp866
	unix charset = UTF8

	interfaces = lo eth0
	bind interfaces only = yes
	disable netbios = yes
	smb ports = 445
	server min protocol = SMB2_10

	security = user
	passdb backend = tdbsam
	map to guest = bad user
	guest account = nobody

	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes

	# Do not spawn on-demand DCERPC daemons during file transfers:
	# mdssvc = Spotlight search, witness = cluster mobility, fsrvp = VSS.
	# classic/lsad/winreg/epmapper stay available but are not auto-started
	# unless a client explicitly asks for them.
	rpc_server:mdssvc = disabled
	rpc_server:witness = disabled
	rpc_server:fsrvp = disabled
	rpc_server:spoolss = disabled
	server services = - dns, - nbt, - printer, - cldap, - kdc

	log file = /var/log/samba/log.%m
	max log size = 1000
	logging = file

	# Performance on a slow CPU: no signing/encryption, zero-copy send, splice on receive
	server signing = disabled
	server smb encrypt = off
	use sendfile = yes
	# Async reads go through a thread pool and a copy, which bypasses sendfile:
	# read 64 -> 106 MB/s with this set to 0. Async writes stay on (sync writes were not faster).
	aio read size = 0
	min receivefile size = 16384
	socket options = TCP_NODELAY IPTOS_LOWDELAY
	strict allocate = yes
	deadtime = 15

	unix extensions = no
	case sensitive = auto
	preserve case = yes
	short preserve case = yes
	veto files = /.nflc_data/

[Public]
	path = /DataVolume/shares/Public
	comment = Public Share
	guest ok = yes
	browseable = yes
	writable = yes
	create mask = 0744
	directory mask = 0775
	map read only = no
